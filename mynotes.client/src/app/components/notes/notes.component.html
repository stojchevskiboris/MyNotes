<div class="notes-workspace py-4">

    <div class="workspace-header d-flex justify-content-between align-items-center mb-4 px-4">
      <h1 class="m-0 display-5 fw-bold text-primary">My Workspace</h1>
      <button class="btn btn-primary btn-lg shadow-sm" (click)="addNote()">
        <i class="bi bi-plus-lg"></i> New Note
      </button>
    </div>
  
    <div class="notes-container" #workspace>
        <!-- Use a single container for all active notes to allow free movement -->
         <ng-container *ngFor="let note of notes">
            <div *ngIf="!note.isArchived"
                 class="note-wrapper"
                 cdkDrag
                 [cdkDragFreeDragPosition]="{x: note.posX, y: note.posY}"
                 (cdkDragEnded)="onDragEnded($event, note)"
                 [style.width.px]="note.width"
                 [style.height.px]="note.height">

                <div class="card note-card h-100 shadow-sm" #card [style.backgroundColor]="note.colorTag">
                    <div class="card-header d-flex justify-content-between align-items-center border-0 bg-transparent">
                        <span class="badge rounded-pill text-bg-light shadow-sm" *ngIf="note.tags">{{ note.tags }}</span>
                        <div class="note-actions">
                            <button class="btn btn-sm btn-icon" (click)="togglePin(note)" [class.pinned]="note.isPinned">
                                <i class="bi" [ngClass]="note.isPinned ? 'bi-pin-fill' : 'bi-pin'"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body overflow-hidden">
                        <h5 class="card-title fw-bold text-truncate">{{ note.title }}</h5>
                        <p class="card-text text-muted">{{ note.content }}</p>
                    </div>
                    <div class="card-footer border-0 bg-transparent d-flex justify-content-between align-items-center">
                        <small class="text-muted">{{ note.modifiedAt | date:'shortDate' }}</small>
                        <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-secondary border-0" (click)="editNote(note.id)"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-warning border-0" (click)="archiveNote(note.id)"><i class="bi bi-archive"></i></button>
                            <button class="btn btn-sm btn-outline-danger border-0" (click)="deleteNote(note.id)"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>

                    <!-- Resize handle -->
                    <div class="resize-handle" (mousedown)="onResizeStart($event, note, card)"></div>
                </div>
            </div>
         </ng-container>
    </div>

    <!-- ARCHIVED SECTION - Separate because usually they shouldn't clutter the workspace -->
    <div *ngIf="archivedNotes.length > 0" class="archived-section mt-5 px-4">
      <hr>
      <h2 class="mb-4 text-muted"><i class="bi bi-archive"></i> Archived Notes</h2>
  
      <div class="row g-3">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let note of archivedNotes">
          <div class="card note-card h-100 border-0 shadow-sm bg-light" [style.backgroundColor]="note.colorTag">
            <div class="card-body">
              <h5 class="card-title fw-bold">{{ note.title }}</h5>
              <p class="card-text text-muted">{{ note.content }}</p>
            </div>
            <div class="card-footer border-0 bg-transparent d-flex justify-content-between align-items-center">
              <button class="btn btn-sm btn-success" (click)="unarchiveNote(note.id)">Restore</button>
              <button class="btn btn-sm btn-outline-danger border-0" (click)="deleteNote(note.id)"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  
  </div>
