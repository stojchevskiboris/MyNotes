<div class="notes-workspace" [class.dark-theme]="user?.theme === 'dark'">

  <div class="workspace-header d-flex justify-content-between align-items-center p-4">
    <div class="d-flex align-items-center">
      <h1 class="m-0 display-6 fw-bold text-primary me-4">MyNotes</h1>
      <div class="search-bar shadow-sm rounded-pill px-3 py-1 bg-white d-flex align-items-center">
        <i class="bi bi-search text-muted me-2"></i>
        <input type="text" class="form-control border-0 shadow-none" placeholder="Search notes..."
          [(ngModel)]="searchText">
      </div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary rounded-circle btn-lg shadow add-note-btn" (click)="addNote()"
        title="Add New Note">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="btn btn-light rounded-circle btn-lg shadow" (click)="openSettings()" title="User Settings">
        <i class="bi bi-person-gear"></i>
      </button>
      <button class="btn btn-light rounded-circle btn-lg shadow text-danger" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>

  <div class="notes-container" #workspace>
    <!-- Use a single container for all active notes to allow free movement -->
    <ng-container *ngFor="let note of filteredNotes">
      <div *ngIf="!note.isArchived" class="note-wrapper" cdkDrag
        [cdkDragFreeDragPosition]="{x: note.posX, y: note.posY}" (cdkDragEnded)="onDragEnded($event, note)"
        (mousedown)="onNoteMouseDown(note)" [style.width.px]="note.width" [style.height.px]="note.height"
        [style.zIndex]="note.zIndex">

        <div class="card note-card h-100 shadow-sm" #card [style.backgroundColor]="note.color"
          (dblclick)="editNote(note.id)">
          <div class="card-header d-flex justify-content-between align-items-center border-0 bg-transparent pt-3">
            <div class="note-tags">
              <div *ngIf="note.tags">
                <span *ngFor="let tag of note.tags.split(',')" class="badge rounded-pill text-bg-light shadow-sm">{{
                  tag.trim() }}</span>
              </div>
            </div>
            <div class="note-actions d-flex align-items-center">
              <div class="mobile-sorting-btns d-none me-2">
                <button class="btn btn-sm btn-icon p-0" (click)="moveUp(note); $event.stopPropagation()"
                  title="Move Up">
                  <i class="bi bi-caret-up-fill"></i>
                </button>
                <button class="btn btn-sm btn-icon p-0" (click)="moveDown(note); $event.stopPropagation()"
                  title="Move Down">
                  <i class="bi bi-caret-down-fill"></i>
                </button>
              </div>
              <button class="btn btn-sm btn-icon" (click)="togglePin(note)" [class.pinned]="note.isPinned"
                title="Pin Note">
                <i class="bi" [ngClass]="note.isPinned ? 'bi-pin-fill' : 'bi-pin'"></i>
              </button>
            </div>
          </div>

          <div class="card-body overflow-auto pt-1">
            <ng-container *ngIf="editingNoteId !== note.id; else editMode">
              <h5 class="card-title fw-bold text-truncate mb-2">{{ note.title }}</h5>
              <p class="card-text text-muted note-content text-start">{{ note.content }}</p>
            </ng-container>
            <ng-template #editMode>
              <div class="d-flex flex-column gap-2 h-100">
                <div>
                  <input type="text" class="form-control form-control-sm mb-2 fw-bold" [(ngModel)]="note.title"
                    placeholder="Title">
                </div>
                <div class="flex-grow-1">
                  <textarea class="form-control form-control-sm note-textarea mb-2 h-100" [(ngModel)]="note.content"
                    placeholder="Content"></textarea>
                </div>
                <div class="d-flex gap-2 align-items-center">
                  <div class="flex-grow-1 text-start">
                    <label for="tags-input" class="form-label mb-1">Tags</label>
                    <input id="tags-input" type="text" class="form-control form-control-sm" [(ngModel)]="note.tags"
                      placeholder="Tags (comma separated)">
                  </div>
                  <div class="text-start">
                    <label for="color-input" class="form-label mb-1">Color</label>
                    <input id="color-input" type="color" class="form-control form-control-color form-control-sm"
                      [(ngModel)]="note.color" title="Choose color">
                  </div>
                </div>
              </div>
            </ng-template>
          </div>

          <div class="card-footer border-0 bg-transparent d-flex justify-content-between align-items-center pb-3">
            <small class="text-muted">{{ note.modifiedAt | date:'MMM d' }}</small>
            <div class="d-flex gap-1">
              <ng-container *ngIf="editingNoteId !== note.id; else saveBtn">
                <button class="btn btn-sm btn-light border-0 shadow-sm" (click)="editNote(note.id)" title="Edit"><i
                    class="bi bi-pencil"></i></button>
              </ng-container>
              <ng-template #saveBtn>
                <button class="btn btn-sm btn-success border-0 shadow-sm" (click)="saveNote(note)" title="Save"><i
                    class="bi bi-check-lg"></i></button>
              </ng-template>
              <button class="btn btn-sm btn-light border-0 shadow-sm" (click)="archiveNote(note.id)" title="Archive"><i
                  class="bi bi-archive"></i></button>
              <button class="btn btn-sm btn-light border-0 shadow-sm text-danger" (click)="confirmDeleteNote(note.id)"
                title="Delete"><i class="bi bi-trash"></i></button>
            </div>
          </div>

          <!-- Resize handle -->
          <div class="resize-handle" (mousedown)="onResizeStart($event, note, card)"></div>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- ARCHIVED SECTION -->
  <div *ngIf="archivedNotes.length > 0" class="archived-section mt-5 px-4 pb-5">
    <hr class="mb-4">
    <h4 class="mb-4 text-muted"><i class="bi bi-archive me-2"></i> Archived Notes</h4>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let note of archivedNotes">
        <div class="card note-card h-100 border-0 shadow-sm bg-light" [style.backgroundColor]="note.color">
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ note.title }}</h5>
            <p class="card-text text-muted">{{ note.content }}</p>
          </div>
          <div class="card-footer border-0 bg-transparent d-flex justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-success border-0" (click)="unarchiveNote(note.id)">Restore</button>
            <button class="btn btn-sm btn-outline-danger border-0" (click)="confirmDeleteNote(note.id)"><i
                class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" [class.show]="showDeleteModal" [style.display]="showDeleteModal ? 'block' : 'none'"
  tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Delete Note</h5>
        <button type="button" class="btn-close" (click)="showDeleteModal = false"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-exclamation-triangle text-warning display-1 mb-3"></i>
        <p class="lead">Are you sure you want to delete this note? This action cannot be undone.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center pb-4">
        <button type="button" class="btn btn-light px-4" (click)="showDeleteModal = false">Cancel</button>
        <button type="button" class="btn btn-danger px-4" (click)="deleteNote()">Delete</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showDeleteModal"></div>

<!-- User Settings Modal -->
<div class="modal fade" [class.show]="showSettingsModal" [style.display]="showSettingsModal ? 'block' : 'none'"
  tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg border-0" *ngIf="settingsUser">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">User Settings</h5>
        <button type="button" class="btn-close" (click)="showSettingsModal = false"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label fw-bold">Name</label>
          <input type="text" class="form-control" [(ngModel)]="settingsUser.name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" class="form-control" [(ngModel)]="settingsUser.email"
            [disabled]="settingsUser.isGoogleUser">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Theme</label>
          <select class="form-select" [(ngModel)]="settingsUser.theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" (click)="showSettingsModal = false">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveSettings()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showSettingsModal"></div>
